<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AutoScale — сравнение автомобилей</title>
<style>
:root{--bg:#080d13;--panel:#121923;--panel2:#0d131b;--line:#273241;--text:#eef3f9;--muted:#9ba8b8;--blue:#4f8cff;--cyan:#67d8ff;--green:#47d18c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#162b48 0,transparent 35%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:34px 18px 70px;border-bottom:1px solid var(--line)}.wrap{max-width:1120px;margin:auto}
.logo{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border:2px solid var(--cyan);border-radius:10px;display:grid;place-items:center;font-weight:800;color:var(--cyan)}
h1{font-size:38px;margin:18px 0 6px}.lead{color:var(--muted);font-size:18px}
main{max-width:1120px;margin:-38px auto 0;padding:0 14px 60px}.panel{background:rgba(18,25,35,.96);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 15px 40px #0003}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}select,button{height:54px;border-radius:12px;border:1px solid #334154;padding:0 15px;font-size:16px}select{background:#0a1017;color:#fff}button{background:linear-gradient(135deg,var(--blue),#6f74ff);border:0;color:#fff;font-weight:700;cursor:pointer}
.summary{color:var(--muted);font-size:16px}.cars{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:20px}.tag{display:inline-block;background:#17283d;color:#9ec7ff;padding:5px 10px;border-radius:20px;font-size:12px}.card h2{margin:12px 0 4px;font-size:24px}.brand{color:var(--muted);margin-bottom:14px}
table{width:100%;border-collapse:collapse}td{padding:11px 0;border-bottom:1px solid #202a36;color:var(--muted)}td:last-child{text-align:right;color:#fff;font-weight:700}
.visual-title{margin:0 0 6px;font-size:26px}.visual-sub{color:var(--muted);margin-bottom:22px}.stage{position:relative;background:linear-gradient(180deg,#101925,#0a1017);border:1px solid #253143;border-radius:18px;padding:35px 18px 25px;overflow:hidden}.ground{height:2px;background:#3b4858;margin-top:12px;position:relative}.ground:before{content:"";position:absolute;left:0;right:0;top:-1px;border-top:1px dashed #526173}
.car-row{margin:25px 0}.car-head{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:14px}.car-name{color:#fff;font-weight:700;font-size:17px}
.car-wrap{height:150px;display:flex;align-items:end;position:relative}.car-shape{position:relative;height:100px;max-width:100%;min-width:190px;filter:drop-shadow(0 12px 12px #0008)}
.body{position:absolute;left:0;bottom:20px;width:100%;height:52%;background:linear-gradient(180deg,var(--car),color-mix(in srgb,var(--car) 72%,black));border-radius:12px 18px 10px 10px;border:2px solid color-mix(in srgb,var(--car) 75%,white)}
.roof{position:absolute;left:22%;bottom:58%;width:50%;height:34%;background:linear-gradient(135deg,var(--car2),var(--car));clip-path:polygon(8% 100%,25% 8%,78% 8%,100% 100%);border-radius:20px 20px 0 0}
.window{position:absolute;left:31%;bottom:66%;width:35%;height:18%;background:#172333;border:2px solid #91b4cf;border-radius:8px 13px 3px 3px;transform:skew(-8deg)}
.wheel{position:absolute;bottom:5px;width:36px;height:36px;border-radius:50%;background:#070b10;border:7px solid #2f3947;box-shadow:inset 0 0 0 3px #78899a}.wheel:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#aab5c0}.w1{left:16%}.w2{right:16%}
.diff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.metric{padding:15px;background:#0b1118;border:1px solid #263342;border-radius:14px}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font-size:20px;margin-top:6px}
.legend{display:flex;gap:16px;margin-top:12px;color:var(--muted);font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
footer{text-align:center;color:#657282;padding:25px}
@media(max-width:720px){h1{font-size:31px}.controls,.cars{grid-template-columns:1fr}.diff-grid{grid-template-columns:1fr 1fr}.stage{padding:25px 10px}.car-wrap{height:125px}.car-shape{min-width:150px}.car-name{font-size:15px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo"><div class="mark">AS</div><b>AutoScale</b></div><h1>Сравнение автомобилей в реальном масштабе</h1><div class="lead">Сравнивайте габариты, пропорции и разницу размеров наглядно.</div></div></header>
<main>
<section class="panel"><div class="controls"><select id="car1"></select><select id="car2"></select><button onclick="compare()">Сравнить</button></div></section>
<div id="summary" class="panel summary"></div>
<section class="cars"><div id="card1" class="card"></div><div id="card2" class="card"></div></section>
<section class="panel"><h2 class="visual-title">Вид сбоку — масштаб по длине</h2><div class="visual-sub">Ширина каждого силуэта рассчитывается относительно реальной длины автомобиля.</div><div id="stage" class="stage"></div><div id="diff" class="diff-grid"></div></section>
</main><footer>AutoScale MVP · автомобильные габариты</footer>
<script>
const cars=[
{id:'vezel',name:'Honda Vezel RU1',brand:'Honda',years:'2013–2021',length:4295,width:1770,height:1605,wheelbase:2610,color:'#4f8cff',color2:'#78c8ff'},
{id:'troc',name:'Volkswagen T-Roc',brand:'Volkswagen',years:'2017–н.в.',length:4236,width:1819,height:1584,wheelbase:2590,color:'#f08a5d',color2:'#ffb36d'},
{id:'tcross',name:'Volkswagen T-Cross',brand:'Volkswagen',years:'2018–н.в.',length:4108,width:1760,height:1584,wheelbase:2551,color:'#55c98b',color2:'#7ae7af'},
{id:'levorg',name:'Subaru Levorg VM',brand:'Subaru',years:'2014–2020',length:4690,width:1780,height:1490,wheelbase:2650,color:'#a576ff',color2:'#d2a9ff'},
{id:'accord',name:'Honda Accord VII',brand:'Honda',years:'2002–2008',length:4665,width:1760,height:1445,wheelbase:2670,color:'#e65b6b',color2:'#ff9aa5'}
];
const labels={length:'Длина',width:'Ширина',height:'Высота',wheelbase:'Колёсная база'};
function fill(id,sel){document.getElementById(id).innerHTML=cars.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.name}</option>`).join('')}
fill('car1','vezel');fill('car2','troc');
function car(id){return cars.find(x=>x.id===id)}
function card(c){return `<span class="tag">${c.years}</span><h2>${c.name}</h2><div class="brand">${c.brand}</div><table>${Object.entries(labels).map(([k,l])=>`<tr><td>${l}</td><td>${c[k]} мм</td></tr>`).join('')}</table>`}
function silhouette(c,max){let pct=Math.max(42,c.length/max*88);return `<div class="car-row"><div class="car-head"><span class="car-name">${c.name}</span><span>${c.length} × ${c.width} × ${c.height} мм</span></div><div class="car-wrap"><div class="car-shape" style="width:${pct}%;--car:${c.color};--car2:${c.color2}"><div class="roof"></div><div class="window"></div><div class="body"></div><div class="wheel w1"></div><div class="wheel w2"></div></div></div><div class="ground"></div></div>`}
function compare(){
 const a=car(car1.value),b=car(car2.value);
 card1.innerHTML=card(a);card2.innerHTML=card(b);
 summary.innerHTML=`Сравниваем <b>${a.name}</b> и <b>${b.name}</b>. Все размеры указаны в миллиметрах.`;
 const max=Math.max(a.length,b.length);
 stage.innerHTML=silhouette(a,max)+silhouette(b,max);
 diff.innerHTML=Object.entries(labels).map(([k,l])=>{let d=a[k]-b[k];let winner=d===0?'Одинаково':d>0?a.name:b.name;return `<div class="metric"><span>${l}</span><b>${Math.abs(d)} мм</b><span>${d===0?'без разницы':'разница · больше: '+winner}</span></div>`}).join('');
}
compare();
</script></body></html>
