<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoScale</title>
<style>
:root{--bg:#080d13;--p:#111923;--p2:#182331;--l:#2a394c;--t:#edf3f9;--m:#9caabd;--b:#4285f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:20px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#080d13ee;z-index:2}.wrap,main{max-width:1180px;margin:auto}.logo{font-size:28px;font-weight:800}.logo span{color:var(--b)}.tag{color:var(--m);font-size:14px}main{padding:24px 16px 60px}.panel,.card,.visual,.stat{background:var(--p);border:1px solid var(--l);border-radius:18px}.panel{padding:20px}h1{margin:0 0 8px}.lead{color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{padding:14px;background:#0d151e;border:1px solid var(--l);border-radius:14px}.box h3{color:var(--m);font-size:15px;margin:0 0 8px}input,select,button{width:100%;margin-top:8px;padding:13px;border-radius:10px;border:1px solid var(--l);background:var(--p2);color:var(--t);font-size:15px}button{font-weight:700;cursor:pointer}.primary{background:var(--b);border:0;margin-top:16px}.actions{display:flex;gap:8px}.actions button{flex:1}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.card{padding:18px}.brand,.year,.spec span{color:var(--m)}.card h2{margin:4px 0}.spec{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #243243}.visual{padding:20px;margin-top:18px}.row{padding:20px 0;border-bottom:1px dashed #415166}.meta{display:flex;justify-content:space-between;font-weight:700}.stage{height:135px;position:relative;border-bottom:2px solid #5b6878}.car{position:absolute;bottom:18px;left:0;width:var(--w);height:58px;background:#3c74b9;border:3px solid #83b3ff;border-radius:15px 25px 10px 10px}.car:before{content:"";position:absolute;width:35%;height:35px;left:25%;top:-35px;border:3px solid #83b3ff;border-bottom:0;border-radius:18px 18px 0 0;background:#263a52}.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{padding:16px}.label{color:var(--m)}.stat strong{display:block;font-size:26px;margin:6px 0}.stat small{color:var(--m)}.title{margin:30px 0 12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--p);border:1px solid var(--l)}th,td{padding:13px;text-align:left;border-bottom:1px solid var(--l)}th{color:var(--m)}footer{text-align:center;color:var(--m);padding:30px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.diffs{grid-template-columns:1fr 1fr}.actions{flex-direction:column}}
</style></head><body>
<header><div class="wrap"><div class="logo">Auto<span>Scale</span></div><div class="tag">Сравнение реальных габаритов автомобилей</div></div></header>
<main><section class="panel"><h1>Сравнить автомобили</h1><p class="lead">Выберите две машины и получите наглядное сравнение.</p>
<div class="grid"><div class="box"><h3>Автомобиль №1</h3><input id="q1" placeholder="Поиск"><select id="b1"></select><select id="m1"></select></div><div class="box"><h3>Автомобиль №2</h3><input id="q2" placeholder="Поиск"><select id="b2"></select><select id="m2"></select></div></div>
<button class="primary" onclick="render()">Сравнить автомобили</button><div class="actions"><button onclick="swap()">⇄ Поменять местами</button><button onclick="share()">🔗 Скопировать ссылку</button><button onclick="resetAll()">Сбросить</button></div><div id="msg"></div></section>
<section class="cards" id="cards"></section><section class="visual"><h2>Вид сбоку — одинаковый масштаб</h2><div id="vis"></div></section><h2 class="title">Разница габаритов</h2><section class="diffs" id="diffs"></section><h2 class="title">Подробное сравнение</h2><div class="tablewrap"><table><thead><tr><th>Параметр</th><th id="n1"></th><th id="n2"></th><th>Разница</th></tr></thead><tbody id="tbl"></tbody></table></div></main><footer>AutoScale · автомобильное сравнение</footer>
<script>
const cars=[
["Honda","Vezel RU1","2013–2021",4295,1770,1605,2610,185,1190,393,"1.5 л",131,"Передний / 4WD","5.2–6.5"],
["Honda","Vezel RU3 Hybrid","2013–2021",4295,1770,1605,2610,170,1380,393,"1.5 Hybrid",132,"Передний / 4WD","3.5–5.0"],
["Honda","CR-V","2017–2022",4635,1855,1689,2660,208,1600,522,"2.0–2.4 л",190,"Передний / AWD","7.0–9.0"],
["Honda","Fit","2013–2020",3955,1695,1525,2530,135,1020,354,"1.3–1.5 л",132,"Передний / 4WD","4.5–6.0"],
["Volkswagen","T-Roc","2017–н.в.",4236,1819,1584,2590,161,1290,445,"1.0–2.0 л",110,"Передний / 4Motion","4.8–7.5"],
["Volkswagen","T-Cross","2018–н.в.",4108,1760,1584,2551,185,1210,455,"1.0–1.5 л",115,"Передний","5.5–6.8"],
["Volkswagen","Tiguan","2016–2024",4509,1839,1675,2677,191,1590,615,"1.4–2.0 л",150,"Передний / 4Motion","6.0–9.0"],
["Subaru","Levorg 1.6 GT-S","2014–2020",4690,1780,1490,2650,130,1530,522,"1.6 Turbo",170,"AWD","7.0–8.5"],
["Subaru","XV","2017–2023",4485,1800,1550,2665,220,1430,310,"1.6–2.0 л",150,"AWD","7.0–8.0"],
["Subaru","Forester","2018–н.в.",4640,1815,1730,2670,220,1590,509,"2.0–2.5 л",185,"AWD","7.5–9.0"],
["Toyota","C-HR","2016–2023",4390,1795,1550,2640,155,1420,377,"1.2T / 1.8 Hybrid",122,"Передний / AWD","4.0–6.5"],
["Toyota","RAV4","2018–н.в.",4600,1855,1685,2690,195,1640,580,"2.0–2.5 л",199,"Передний / AWD","5.0–8.0"],
["Toyota","Harrier","2020–н.в.",4740,1855,1660,2690,190,1680,409,"2.0 / 2.5 Hybrid",171,"Передний / AWD","4.5–7.5"],
["Mazda","CX-3","2015–н.в.",4275,1765,1550,2570,160,1250,350,"1.5–2.0 л",150,"Передний / AWD","5.0–7.0"],
["Mazda","CX-5","2017–н.в.",4550,1840,1680,2700,192,1610,442,"2.0–2.5 л",194,"Передний / AWD","6.5–9.0"],
["Mazda","CX-30","2019–н.в.",4395,1795,1540,2655,175,1420,430,"2.0–2.5 л",150,"Передний / AWD","5.5–7.5"],
["Nissan","Qashqai","2014–2021",4394,1806,1590,2646,200,1373,430,"1.2–2.0 л",144,"Передний / AWD","5.5–8.0"],
["Nissan","X-Trail","2014–2022",4690,1820,1710,2705,210,1640,565,"2.0–2.5 л",171,"Передний / AWD","7.0–9.5"]
].map(x=>({brand:x[0],model:x[1],years:x[2],length:x[3],width:x[4],height:x[5],wheelbase:x[6],clearance:x[7],weight:x[8],trunk:x[9],engine:x[10],power:x[11],drive:x[12],consumption:x[13]}));
const $=x=>document.getElementById(x), brands=[...new Set(cars.map(c=>c.brand))];
function setup(s){$("b"+s).innerHTML='<option value="">Марка</option>'+brands.map(b=>'<option>'+b+'</option>').join("");$("b"+s).onchange=()=>models(s);$("q"+s).oninput=()=>search(s)}
function models(s,list){let a=list||cars.filter(c=>!$("b"+s).value||c.brand===$("b"+s).value);$("m"+s).innerHTML='<option value="">Модель</option>'+a.map(c=>'<option value="'+cars.indexOf(c)+'">'+c.model+' ('+c.years+')</option>').join("")}
function search(s){let q=$("q"+s).value.toLowerCase();models(s,q?cars.filter(c=>(c.brand+" "+c.model).toLowerCase().includes(q)):null)}
function get(s){return cars[+$("m"+s).value]}
function card(c){let z=[["Длина",c.length+" мм"],["Ширина",c.width+" мм"],["Высота",c.height+" мм"],["Колёсная база",c.wheelbase+" мм"],["Клиренс",c.clearance+" мм"],["Масса",c.weight+" кг"],["Багажник",c.trunk+" л"],["Двигатель",c.engine],["Мощность",c.power+" л.с."],["Привод",c.drive]];return '<article class="card"><div class="brand">'+c.brand+'</div><h2>'+c.model+'</h2><div class="year">'+c.years+'</div>'+z.map(x=>'<div class="spec"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join("")+'</article>'}
function render(){let a=get(1),b=get(2);if(!a||!b)return;$("cards").innerHTML=card(a)+card(b);let max=Math.max(a.length,b.length);$("vis").innerHTML=[a,b].map(c=>'<div class="row"><div class="meta"><span>'+c.brand+' '+c.model+'</span><span>'+c.length+' мм</span></div><div class="stage"><div class="car" style="--w:'+(c.length/max*100)+'%"></div></div></div>').join("");let ks=[["Длина","length"],["Ширина","width"],["Высота","height"],["Колёсная база","wheelbase"]];$("diffs").innerHTML=ks.map(x=>{let d=Math.abs(a[x[1]]-b[x[1]]),p=(d/Math.min(a[x[1]],b[x[1]])*100).toFixed(1);return '<div class="stat"><div class="label">'+x[0]+'</div><strong>'+d+' мм</strong><small>'+p+'%</small></div>'}).join("");$("n1").textContent=a.brand+" "+a.model;$("n2").textContent=b.brand+" "+b.model;let rows=[["Годы","years",""],["Длина","length"," мм"],["Ширина","width"," мм"],["Высота","height"," мм"],["Колёсная база","wheelbase"," мм"],["Клиренс","clearance"," мм"],["Масса","weight"," кг"],["Багажник","trunk"," л"],["Двигатель","engine",""],["Мощность","power"," л.с."],["Привод","drive",""],["Расход","consumption"," л/100 км"]];$("tbl").innerHTML=rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+a[r[1]]+r[2]+'</td><td>'+b[r[1]]+r[2]+'</td><td>'+(typeof a[r[1]]==="number"?Math.abs(a[r[1]]-b[r[1]])+r[2]:"—")+'</td></tr>').join("");history.replaceState({},'',location.pathname+"?a="+$("m1").value+"&b="+$("m2").value)}
function swap(){let a=$("m1").value,b=$("m2").value;$("m1").value=b;$("m2").value=a;render()}
async function share(){try{await navigator.clipboard.writeText(location.href);$("msg").textContent="Ссылка скопирована!"}catch(e){$("msg").textContent=location.href}}
function resetAll(){location.href=location.pathname}
setup(1);setup(2);$("b1").value="Honda";models(1);$("m1").value=0;$("b2").value="Volkswagen";models(2);$("m2").value=4;render();
</script></body></html>
